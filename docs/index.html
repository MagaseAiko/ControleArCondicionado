<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d12">
<title>Controles</title>
<style>
/* Layout: app de uma coluna (largura de celular), barra de abas embaixo, perfis em chips no topo */
:root {
  --bg: #f4f3f8;
  --surface: #ffffff;
  --surface-2: #ece9f4;
  --border: #e0dbec;
  --border-strong: #c3bcd6;
  --text: #16131f;
  --muted: #6b6580;
  --accent: #c9b8f5;
  --accent-strong: #5b43b8;
  --on-accent: #1c1430;
  --danger: #d93c45;
  --danger-soft: #fbe6e7;
  --success: #23905f;
  --success-soft: #def3e9;
  --warning: #c27a12;
  --info: #2f6ae8;
  --info-soft: #e2ebfd;
  --shadow: 0 1px 2px rgb(22 19 31 / .06), 0 6px 20px rgb(22 19 31 / .05);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0d12; --surface: #18161f; --surface-2: #232030; --border: #2b2738; --border-strong: #4a4460;
  --text: #f2eff9; --muted: #9b94b0; --accent: #c9b8f5; --accent-strong: #c9b8f5; --on-accent: #1c1430;
  --danger: #ff6b72; --danger-soft: #3a1c22; --success: #4cd38f; --success-soft: #16301f; --warning: #f2b04a;
  --info: #7ea6ff; --info-soft: #1b2540; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e0d12; --surface: #18161f; --surface-2: #232030; --border: #2b2738; --border-strong: #4a4460;
  --text: #f2eff9; --muted: #9b94b0; --accent: #c9b8f5; --accent-strong: #c9b8f5; --on-accent: #1c1430;
  --danger: #ff6b72; --danger-soft: #3a1c22; --success: #4cd38f; --success-soft: #16301f; --warning: #f2b04a;
  --info: #7ea6ff; --info-soft: #1b2540; --shadow: none; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-top: env(safe-area-inset-top, 0px);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app { max-width: 560px; margin: 0 auto; padding: 0 var(--gutter-r) calc(104px + env(safe-area-inset-bottom, 0px)) var(--gutter); }

/* ---------- topo ---------- */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-block: 18px 6px; }
.top-title { min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
h1 { font-size: 28px; line-height: 1.15; margin: 2px 0 0; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--success); box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 22%, transparent); }
.dot.warn { background: var(--warning); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warning) 22%, transparent); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 10px 6px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; font-size: 14px; font-weight: 600; }
.chip .ic { width: 18px; height: 18px; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.add { color: var(--muted); border-style: dashed; }

/* ---------- controle ---------- */
.view { display: grid; gap: 18px; padding-top: 8px; }
.editbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 18px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; }
.editbar .btn { height: 36px; background: var(--on-accent); color: var(--accent); }
.section { display: grid; gap: 10px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.section-head h3 { margin: 0 0 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.section-head input { flex: 1; min-width: 0; height: 38px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 78px; gap: 10px; grid-auto-flow: row dense; }
.tile { position: relative; border: 0; border-radius: 22px; background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; min-width: 0;
  font-size: 12.5px; font-weight: 600; text-align: center; transition: transform .12s ease, background .2s ease; user-select: none; }
.tile .tl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .ic { width: 24px; height: 24px; }
button.tile:active, .tile button:active { transform: scale(.95); }
.tile.c-accent { background: var(--accent); color: var(--on-accent); }
.tile.c-danger { background: var(--danger-soft); color: var(--danger); }
.tile.c-success { background: var(--success-soft); color: var(--success); }
.tile.c-info { background: var(--info-soft); color: var(--info); }
.tile.c-dark { background: var(--text); color: var(--bg); }
.miss-dot { position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
.tile.missing, .rk.missing, .dp.missing { opacity: .55; }
.tile.flash { animation: flash .35s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 10px transparent; } }

.rocker { grid-row: span 2; padding: 6px; justify-content: space-between; gap: 0; }
.rk { position: relative; flex: 1; width: 100%; border: 0; background: transparent; color: inherit; border-radius: 16px; display: grid; place-items: center; transition: background .15s; }
.rk:active { background: var(--surface-2); }
.rk-label { font-size: 12px; color: var(--muted); padding-block: 2px; }

.dpad-wrap { grid-column: 1 / -1; grid-row: span 3; display: grid; place-items: center; }
.dpad { position: relative; width: min(250px, 100%); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); }
.dp { position: absolute; border: 0; background: transparent; color: inherit; display: grid; place-items: center; border-radius: 50%; width: 33%; height: 33%; transition: background .15s; }
.dp:active { background: var(--surface-2); }
.dp.up { top: 2%; left: 33.5%; } .dp.down { bottom: 2%; left: 33.5%; } .dp.left { left: 2%; top: 33.5%; } .dp.right { right: 2%; top: 33.5%; }
.dp.ok { top: 31%; left: 31%; width: 38%; height: 38%; background: var(--surface-2); font-weight: 700; font-size: 15px; }
.dp .miss-dot, .rk .miss-dot { top: 6px; right: 6px; }

.editing .tile, .editing .dpad { outline: 1.5px dashed var(--accent-strong); outline-offset: 2px; }
.editing .tile::after, .editing .dpad-wrap::after { content: ""; }
.tile.add { background: transparent; box-shadow: none; border: 1.5px dashed var(--border-strong); color: var(--muted); outline: none !important; }
.add-section { height: 52px; border-radius: 18px; border: 1.5px dashed var(--border-strong); background: transparent; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }

/* ---------- cartões, listas ---------- */
.card { background: var(--surface); border-radius: 24px; padding: 18px; display: grid; gap: 14px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.card p, .hint { margin: 0; color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.mono { font-family: var(--mono); font-size: 13px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); min-width: 0; }
.list li:first-child { border-top: 0; }
.li-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.li-main b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-main small { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag.ok { background: var(--success-soft); color: var(--success); }
.tag.pend { background: var(--surface-2); color: var(--muted); }
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent-strong); border-radius: inherit; transition: width .3s; }
.empty { text-align: center; padding: 36px 18px; display: grid; gap: 12px; justify-items: center; }
.empty .big { width: 64px; height: 64px; border-radius: 22px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.empty .big .ic { width: 30px; height: 30px; }
.empty h2 { margin: 0; font-size: 20px; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }

/* ---------- botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--surface-2); color: var(--text); font-weight: 600; font-size: 15px; white-space: nowrap; }
.btn .ic { width: 20px; height: 20px; }
.btn.primary { background: var(--text); color: var(--bg); }
.btn.accent { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.small { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface-2); color: var(--text); display: grid; place-items: center; flex: none; }
.icon-btn .ic { width: 20px; height: 20px; }
.icon-btn.rec { color: var(--danger); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.sheet-in:focus { outline: none; }

/* ---------- formulários ---------- */
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select { height: 48px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 0 14px; font-size: 16px; font-weight: 400; width: 100%; min-width: 0; }
.section-head input { border-radius: 12px; border: 1px solid var(--border); background: var(--bg); padding: 0 12px; font-size: 15px; }
.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-width: 0; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .15); }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.icon-grid button { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); display: grid; place-items: center; font-size: 12px; }
.icon-grid button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border); }
.swatches button.on { border-color: var(--text); box-shadow: 0 0 0 3px var(--bg) inset; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 15px; }
.switch input { appearance: none; width: 50px; height: 30px; border-radius: 999px; background: var(--border-strong); position: relative; flex: none; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked { background: var(--accent-strong); }
.switch input:checked::after { transform: translateX(20px); }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.tpl { display: grid; gap: 6px; justify-items: start; text-align: left; padding: 14px; border-radius: 18px; border: 1.5px solid var(--border); background: var(--bg); }
.tpl.on { border-color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 25%, var(--bg)); }
.tpl b { font-size: 14px; } .tpl small { color: var(--muted); font-size: 12px; }

/* ---------- abas ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  padding: 6px var(--gutter-r) calc(8px + env(safe-area-inset-bottom, 0px)) var(--gutter);
  background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--border); }
.tabbar .inner { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: grid; justify-items: center; gap: 4px; padding: 4px 0; border: 0; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.tab .pillic { width: 56px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
.tab.on { color: var(--text); }
.tab.on .pillic { background: var(--accent); color: var(--on-accent); }

/* ---------- folha (dialog) ---------- */
dialog.sheet { border: 0; padding: 0; width: 100%; max-width: 560px; max-height: 90vh; margin: auto auto 0; border-radius: 28px 28px 0 0; background: var(--surface); color: var(--text); }
dialog.sheet::backdrop { background: rgb(8 6 14 / .5); }
@media (min-width: 640px) { dialog.sheet { margin: auto; border-radius: 28px; } }
.sheet-in { display: grid; gap: 16px; padding: 10px var(--gutter-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gutter); max-height: 90vh; overflow: auto; }
@media (min-width: 640px) { .sheet-in { padding: 20px 24px 24px; } }
.grabber { width: 40px; height: 5px; border-radius: 999px; background: var(--border-strong); justify-self: center; }
@media (min-width: 640px) { .grabber { display: none; } }
.sheet-in h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet-actions .btn { flex: 1 1 120px; }

/* ---------- gravação ---------- */
.learn { display: grid; justify-items: center; gap: 14px; text-align: center; padding-block: 8px; }
.ring { position: relative; width: 150px; height: 150px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--accent-strong); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring .center { position: absolute; inset: 0; display: grid; place-items: center; }
.ring .center .ic { width: 44px; height: 44px; }
.learn.ok .ring .fg { stroke: var(--success); }
.learn.fail .ring .fg { stroke: var(--danger); }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); opacity: .7; } }
.learn h2 { margin: 0; }
.learn p { margin: 0; color: var(--muted); max-width: 36ch; }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; max-width: calc(100% - 32px);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 16px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 30px rgb(0 0 0 / .25); }
.toast.err { background: var(--danger); color: #fff; }
.banner { border-radius: 18px; padding: 14px 16px; background: color-mix(in srgb, var(--warning) 16%, var(--surface)); font-size: 14px; display: grid; gap: 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-title">
      <div class="eyebrow" id="topEyebrow">Controle universal</div>
      <h1 id="topTitle">Controles</h1>
    </div>
    <button class="pill" id="connPill" type="button"><span class="dot" id="connDot"></span><span id="connText">Conectar</span></button>
  </header>
  <nav class="chips" id="chips" aria-label="Controles"></nav>

  <main>
    <section class="view" id="view-remote"></section>
    <section class="view" id="view-commands" hidden></section>
    <section class="view" id="view-profiles" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>

<nav class="tabbar" aria-label="Seções">
  <div class="inner">
    <button class="tab on" data-view="remote" type="button"><span class="pillic" data-ic="grid"></span>Controle</button>
    <button class="tab" data-view="commands" type="button"><span class="pillic" data-ic="list"></span>Comandos</button>
    <button class="tab" data-view="profiles" type="button"><span class="pillic" data-ic="layers"></span>Perfis</button>
    <button class="tab" data-view="settings" type="button"><span class="pillic" data-ic="sliders"></span>Ajustes</button>
  </div>
</nav>

<dialog class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
// ======================================================================
// Ícones (traço, 24x24)
// ======================================================================
const ICONS = {
  power: '<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  up: '<path d="m6 15 6-6 6 6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  left: '<path d="m15 6-6 6 6 6"/>',
  right: '<path d="m9 6 6 6-6 6"/>',
  snow: '<path d="M12 2v20M4.9 7l14.2 10M4.9 17 19.1 7"/><path d="m9 4 3 2 3-2M9 20l3-2 3 2"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  temp: '<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
  fan: '<circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7s3 4-2 7M14 12c4 0 7 1 7 4s-4 3-7-2M12 14c0 4-1 7-4 7s-3-4 2-7M10 12c-4 0-7-1-7-4s4-3 7 2"/>',
  swing: '<path d="M4 8c3-3 13-3 16 0"/><path d="M12 8v12"/><path d="m8 16 4 4 4-4"/>',
  mode: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  leaf: '<path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"/><path d="m5 19 8-8"/>',
  light: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  volume: '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',
  mute: '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 10 4 4M21 10l-4 4"/>',
  tv: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="m8 2 4 4 4-4"/>',

const UUID = {
  svc: 'c9b8f500-ac00-4c0d-9e5a-2b1d4e000001',
  rx: 'c9b8f500-ac00-4c0d-9e5a-2b1d4e000002',
  tx: 'c9b8f500-ac00-4c0d-9e5a-2b1d4e000003',
};

class BleLink {
  constructor(onMsg, onClose) {
    this.name = 'Bluetooth'; this.kind = 'ble';
    this.onMsg = onMsg; this.onClose = onClose;
    this.buf = ''; this.q = Promise.resolve();
    this.enc = new TextEncoder(); this.dec = new TextDecoder();
  }
  async open() {
    this.device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [UUID.svc] }, { namePrefix: 'ArCondicionado' }],
      optionalServices: [UUID.svc],
    });
    this.device.addEventListener('gattserverdisconnected', () => this.onClose());
    const server = await this.device.gatt.connect();
    const svc = await server.getPrimaryService(UUID.svc);
    this.rx = await svc.getCharacteristic(UUID.rx);
    this.tx = await svc.getCharacteristic(UUID.tx);
    this.tx.addEventListener('characteristicvaluechanged', e => this.feed(e.target.value));
    await this.tx.startNotifications();
    this.name = 'Bluetooth · ' + (this.device.name || 'receptor');
  }
  feed(dataView) {
    this.buf += this.dec.decode(dataView, { stream: true });
    let i;
    while ((i = this.buf.indexOf('\n')) >= 0) {
      const line = this.buf.slice(0, i).trim();
      this.buf = this.buf.slice(i + 1);
      if (line) { try { this.onMsg(JSON.parse(line)); } catch (e) { console.warn('BLE: linha inválida', line); } }
    }
  }
  send(obj) {
    const data = this.enc.encode(JSON.stringify(obj) + '\n');
    // Web Bluetooth não aceita escritas simultâneas: serializa numa fila
    this.q = this.q.then(async () => {
      for (let i = 0; i < data.length; i += 180) {
        const part = data.slice(i, i + 180);
        if (this.rx.writeValueWithResponse) await this.rx.writeValueWithResponse(part);
        else await this.rx.writeValue(part);
      }
    }).catch(e => { console.warn(e); toast('Falha ao enviar por Bluetooth', 'err'); });
    return this.q;
  }
  close() { if (this.device && this.device.gatt.connected) this.device.gatt.disconnect(); }
}

class HttpLink {
  constructor(onMsg, onClose) {
    this.name = 'Wi-Fi · ' + location.host; this.kind = 'wifi';
    this.onMsg = onMsg; this.onClose = onClose; this.fails = 0;
  }
  async open() {
    await this.post({ c: 'status' });
    this.timer = setInterval(() => this.post({ c: 'poll' }).catch(() => {}), 800);
  }
  async post(obj) {
    try {
      const r = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(obj) + '\n' });
      const msgs = await r.json();
      this.fails = 0;
      msgs.forEach(m => this.onMsg(m));
    } catch (e) {
      if (++this.fails >= 5) { this.close(); this.onClose(); }
      throw e;
    }
  }
  send(obj) { return this.post(obj).catch(() => toast('O receptor não respondeu', 'err')); }
  close() { clearInterval(this.timer); }
}

// Simula o receptor (sinais, perfis, gravação) para conhecer a página sem hardware
class DemoLink {
  constructor(onMsg, onClose) {
    this.name = 'Demonstração'; this.kind = 'demo';
    this.onMsg = onMsg; this.onClose = onClose;
    this.sigs = new Map();
    this.profiles = new Map();
    const ac = makeProfile('pdemo', 'Ar da sala', 'ac', 0);
    const tv = makeProfile('pdtv', 'TV da sala', 'tv', 1);
    this.profiles.set(ac.id, serializeProfile(ac));
    this.profiles.set(tv.id, serializeProfile(tv));
    ['power', 'temp_up', 'temp_down', 'mode', 'fan', 'swing'].forEach(k => this.sigs.set('pdemo-' + k, { p: 'COOLIX', b: 24, n: 199, code: true }));
    ['power', 'vol_up', 'vol_down', 'mute', 'up', 'down', 'left', 'right', 'ok'].forEach(k => this.sigs.set('pdtv-' + k, { p: 'NEC', b: 32, n: 67, code: true }));
    this.learning = { active: false, key: '', left: 0 };
  }
  async open() {}
  close() { clearTimeout(this.learnTimer); }
  emit(m) { setTimeout(() => this.onMsg(m), 60); }
  status() {
    this.emit({ t: 'status', fw: 'demo', tr: 'demo', emitter: { paired: true, online: true, mac: 'DE:MO:00:00:00:01', fw: 'demo' },
      learning: this.learning, busy: false, queue: 0 });
  }
  signals() { this.emit({ t: 'signals', list: [...this.sigs].map(([k, v]) => ({ k, ...v })) }); }
  profilesMsg() {
    for (const [id, data] of this.profiles) this.emit({ t: 'profile', id, data: clone(data) });
    this.emit({ t: 'profilesDone', n: this.profiles.size });
  }
  send(o) {
    switch (o.c) {
      case 'hello': this.status(); this.signals(); this.profilesMsg(); break;
      case 'status': this.status(); break;
      case 'send':
        if (this.sigs.has(o.key)) setTimeout(() => this.onMsg({ t: 'sent', ok: true, what: o.key }), 250);
        else this.emit({ t: 'error', msg: 'Comando ainda nao gravado: ' + o.key });
        break;
      case 'learn':
        this.learning = { active: true, key: o.key, left: 15000 }; this.status();
        clearTimeout(this.learnTimer);
        this.learnTimer = setTimeout(() => {
          this.learning = { active: false, key: '', left: 0 };
          if (Math.random() < .12) { this.emit({ t: 'learnTimeout' }); this.status(); return; }
          const protos = [['NEC', 32, 67], ['SAMSUNG', 32, 67], ['WHIRLPOOL_AC', 168, 343], ['RAW', 0, 211]];
          const [p, b, n] = protos[Math.floor(Math.random() * protos.length)];
          this.sigs.set(o.key, { p, b, n, code: p !== 'RAW' });
          this.emit({ t: 'ir', proto: p, bits: b, hex: 'DEMO' });
          this.emit({ t: 'learned', key: o.key, proto: p, bits: b, n });
          this.signals(); this.status();
        }, 1600 + Math.random() * 1400);
        break;
      case 'learnCancel': clearTimeout(this.learnTimer); this.learning = { active: false, key: '', left: 0 }; this.status(); break;
      case 'del': this.sigs.delete(o.key); this.signals(); break;
      case 'rename': { const v = this.sigs.get(o.from); if (v) { this.sigs.delete(o.from); this.sigs.set(o.to, v); } this.signals(); break; }
      case 'saveProfile': this.profiles.set(o.id, clone(o.data)); this.emit({ t: 'profileSaved', id: o.id }); break;
      case 'delProfile':
        this.profiles.delete(o.id);
        for (const k of [...this.sigs.keys()]) if (k.startsWith(o.id + '-')) this.sigs.delete(k);
        this.emit({ t: 'profileDeleted', id: o.id }); this.signals(); break;
      case 'ping': setTimeout(() => this.onMsg({ t: 'sent', ok: true, what: 'ping' }), 300); break;
      case 'unpair': this.emit({ t: 'status', fw: 'demo', tr: 'demo', emitter: { paired: false, online: false, mac: '', fw: '' }, learning: this.learning, busy: false, queue: 0 }); break;
    }
  }
}

function makeProfile(id, name, type, order) {
  const t = TEMPLATES[type] || TEMPLATES.custom;
  return {
    id, name, type, order, icon: t.icon, sendRaw: false,
    commands: t.commands.map(([k, label]) => ({ k, label })),
    layout: clone(t.layout),
  };
}
function serializeProfile(p) {
  return { name: p.name, type: p.type, icon: p.icon, order: p.order, sendRaw: !!p.sendRaw, commands: p.commands, layout: p.layout };
}
function normalizeProfile(id, d) {
  d = d && typeof d === 'object' ? d : {};
  return {
    id, name: String(d.name || 'Controle'), type: TEMPLATES[d.type] ? d.type : 'custom', icon: d.icon || 'remote',
    order: Number.isFinite(d.order) ? d.order : 99, sendRaw: !!d.sendRaw,
    commands: Array.isArray(d.commands) ? d.commands.filter(c => c && c.k).map(c => ({ k: String(c.k), label: String(c.label || c.k) })) : [],
    layout: Array.isArray(d.layout) ? d.layout.map(s => ({ title: String(s.title || ''), items: Array.isArray(s.items) ? s.items : [] })) : [],
  };
}

const active = () => app.profiles.find(p => p.id === app.activeId) || app.profiles[0] || null;
const sigKey = (p, k) => `${p.id}-${k}`;
const hasSig = (p, k) => !!k && app.signals.has(sigKey(p, k));
const cmdLabel = (p, k) => (p.commands.find(c => c.k === k) || {}).label || k || '';
const recordedCount = p => p.commands.filter(c => hasSig(p, c.k)).length;

function slugify(label, p) {
  let base = String(label).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/\+/g, ' mais ').replace(/[−-]/g, ' menos ').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 20) || 'cmd';
  let k = base, n = 2;
  while (p.commands.some(c => c.k === k)) { k = base.slice(0, 17) + '_' + n++; }
  return k;
}
function newProfileId() {
  let id;
  do { id = 'p' + Math.random().toString(36).slice(2, 6); } while (app.profiles.some(p => p.id === id));
  return id;
}

function cacheNow() {
  store.set('cache', { profiles: app.profiles.map(p => ({ id: p.id, data: serializeProfile(p) })), signals: [...app.signals.keys()] });
}

// Conexão e mensagens
// ======================================================================
function send(obj) {
  if (!app.link) { toast('Conecte ao receptor primeiro', 'err'); return false; }
  app.link.send(obj);
  return true;
}
function requireLink() {
  if (app.link) return true;
  toast('Conecte ao receptor para fazer alterações', 'err');
  return false;
}

async function connect(kind) {
  if (app.link) return;
  const onClose = () => {
    if (!app.link) return;
    app.link = null; app.dev = null;
    toast('Receptor desconectado', 'err');
    renderAll();
  };
  const Link = kind === 'demo' ? DemoLink : kind === 'http' ? HttpLink : BleLink;
  const link = new Link(handleMsg, onClose);
  try {
    $('#connText').textContent = 'Conectando…';
    await link.open();
    app.link = link;
    app.cached = false;
    if (kind === 'demo') { app.profiles = []; app.signals = new Map(); }
    link.send({ c: 'hello' });
    toast('Conectado · ' + link.name);
  } catch (e) {
    console.warn(e);
    if (e && e.name === 'NotFoundError') toast('Nenhum receptor escolhido');
    else if (e && e.name === 'SecurityError') toast('Bluetooth bloqueado aqui. Abra a página pelo endereço HTTPS.', 'err');
    else toast('Não foi possível conectar: ' + (e && e.message || e), 'err');
  }
  renderAll();
}

function disconnect() {
  const link = app.link;
  const wasDemo = link && link.kind === 'demo';
  app.link = null; app.dev = null;
  if (link) link.close();
  if (wasDemo) loadCache();
  renderAll();
}

function loadCache() {
  const c = store.get('cache', null);
  app.profiles = c && Array.isArray(c.profiles) ? c.profiles.map(x => normalizeProfile(x.id, x.data)).sort((a, b) => a.order - b.order) : [];
  app.signals = new Map((c && c.signals || []).map(k => [k, {}]));
  app.cached = app.profiles.length > 0;
}

function handleMsg(m) {
  switch (m.t) {
    case 'status': app.dev = m; renderHeader(); if (app.view === 'settings') renderSettings(); break;
    case 'signals':
      app.signals = new Map(m.list.map(s => [s.k, s]));
      if (!app.link || app.link.kind !== 'demo') cacheNow();
      renderCurrent();
      break;
    case 'profile': (app.incoming = app.incoming || []).push(normalizeProfile(m.id, m.data)); break;
    case 'profilesDone':
      app.profiles = (app.incoming || []).sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
      app.incoming = null;
      if (!active() || active().id !== app.activeId) app.activeId = app.profiles[0] ? app.profiles[0].id : null;
      if (!app.link || app.link.kind !== 'demo') cacheNow();
      renderAll();
      break;
    case 'profileSaved': case 'profileDeleted': break;
    case 'learned': onLearned(m); break;
    case 'learnTimeout': onLearnTimeout(); break;
    case 'sent':
      if (!m.ok) toast('Falhou: ' + (m.err || 'erro'), 'err');
      else if (m.what === 'ping') toast('O emissor respondeu');
      break;
    case 'ir': app.lastIr = m; if (app.view === 'settings') renderSettings(); break;
    case 'error': toast(m.msg, 'err'); break;
  }
}

// Salva o perfil no receptor (com um pequeno atraso para juntar alterações seguidas)
function saveProfile(p) {
  clearTimeout(app.saveTimers[p.id]);
  app.saveTimers[p.id] = setTimeout(() => {
    if (app.link) app.link.send({ c: 'saveProfile', id: p.id, data: serializeProfile(p) });
  }, 400);
  if (!app.link || app.link.kind !== 'demo') cacheNow();
}

function press(k, el) {
  const p = active();
  if (!p) return;
  if (!k) return toast('Este botão não tem comando. Toque em Editar para escolher um.');
  if (!hasSig(p, k)) return askLearn(p, k);
  if (!send({ c: 'send', key: sigKey(p, k), raw: !!p.sendRaw })) return;
  if (navigator.vibrate) navigator.vibrate(12);
  const tile = el && (el.closest('.tile') || el.closest('.dpad'));
  if (tile) { tile.classList.remove('flash'); void tile.offsetWidth; tile.classList.add('flash'); }
}

async function askLearn(p, k) {
  if (!app.link) return toast('Conecte ao receptor para gravar comandos', 'err');
  const ok = await confirmSheet(`Gravar “${cmdLabel(p, k)}”?`, 'Este comando ainda não foi gravado. Grave agora com o controle original.', 'Gravar');
  if (ok) startLearn(p, [k]);
}

function addCommand(p, label) {
  const k = slugify(label, p);
  p.commands.push({ k, label: label.trim() || k });
  return k;
}

function deleteCommand(p, k) {
  p.commands = p.commands.filter(c => c.k !== k);
  for (const s of p.layout) for (const it of s.items) for (const f of ['cmd', 'up', 'down', 'left', 'right', 'ok']) if (it[f] === k) it[f] = '';
  if (hasSig(p, k)) send({ c: 'del', key: sigKey(p, k) });
  saveProfile(p);
}

function setView(v) {
  if (app.view !== v && app.editing) app.editing = false;
  app.view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
  for (const id of ['remote', 'commands', 'profiles', 'settings']) $('#view-' + id).hidden = id !== v;
  renderAll();
  window.scrollTo({ top: 0 });
}

// ======================================================================
// Gravação (fila de comandos: um ou vários em sequência)
// ======================================================================
let learnTick = null;
function startLearn(p, keys) {
  if (!requireLink() || !keys.length) return;
  app.learn = { pid: p.id, keys, idx: 0, phase: 'wait', info: null, endsAt: 0 };
  beginLearnStep();
}
function learnCurrent() {
  const L = app.learn; if (!L) return null;
  const p = app.profiles.find(x => x.id === L.pid);
  return p ? { p, k: L.keys[L.idx] } : null;
}
function beginLearnStep() {
  const cur = learnCurrent(); if (!cur) return;
  app.learn.phase = 'wait'; app.learn.info = null; app.learn.endsAt = Date.now() + 15000;
  send({ c: 'learn', key: sigKey(cur.p, cur.k) });
  renderLearn();
  clearInterval(learnTick);
  learnTick = setInterval(() => {
    if (!app.learn || app.learn.phase !== 'wait') return clearInterval(learnTick);
    updateRing();
  }, 250);
}
function onLearned(m) {
  const cur = learnCurrent();
  if (!cur || m.key !== sigKey(cur.p, cur.k)) { toast('Sinal gravado: ' + m.key); return; }
  app.learn.phase = 'ok'; app.learn.info = m;
  if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
  renderLearn();
}
function onLearnTimeout() {
  if (!app.learn) return;
  app.learn.phase = 'fail';
  renderLearn();
}
function closeLearn(cancel) {
  if (cancel && app.learn && app.learn.phase === 'wait') send({ c: 'learnCancel' });
  app.learn = null;
  clearInterval(learnTick);
  closeSheet();
  renderCurrent();
}
function updateRing() {
  const fg = $('#ringFg'); if (!fg || !app.learn) return;
  const C = 2 * Math.PI * 66;
  const left = app.learn.phase === 'wait' ? Math.max(0, app.learn.endsAt - Date.now()) / 15000 : 1;
  fg.style.strokeDasharray = C;
  fg.style.strokeDashoffset = C * (1 - left);
  const s = $('#ringSecs'); if (s) s.textContent = Math.ceil(left * 15) + ' s';
}
function renderLearn() {
  const L = app.learn, cur = learnCurrent(); if (!L || !cur) return;
  const label = cmdLabel(cur.p, cur.k);
  const step = L.keys.length > 1 ? `<div class="eyebrow">${L.idx + 1} de ${L.keys.length} · ${esc(cur.p.name)}</div>` : `<div class="eyebrow">${esc(cur.p.name)}</div>`;
  const hasNext = L.idx < L.keys.length - 1;
  const nextLabel = hasNext ? cmdLabel(cur.p, L.keys[L.idx + 1]) : '';
  let body, actions;
  if (L.phase === 'wait') {
    body = `<div class="learn">${step}
      <div class="ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="66"/><circle class="fg" id="ringFg" cx="75" cy="75" r="66"/></svg>
        <div class="center pulse">${icon('remote')}</div></div>
      <h2>Aperte “${esc(label)}”</h2>
      <p>Aponte o controle original para o receptor e aperte o botão uma vez. <span id="ringSecs" class="mono"></span></p></div>`;
    actions = [{ label: 'Cancelar', act: () => closeLearn(true) }];
  } else if (L.phase === 'ok') {
    const i = L.info || {};
    body = `<div class="learn ok">${step}
      <div class="ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="66"/><circle class="fg" id="ringFg" cx="75" cy="75" r="66"/></svg>
        <div class="center">${icon('check')}</div></div>
      <h2>“${esc(label)}” gravado</h2>
      <p class="mono">${esc(i.proto || 'RAW')}${i.bits ? ' · ' + i.bits + ' bits' : ''} · ${i.n || 0} tempos</p></div>`;
    actions = [
      { label: 'Testar', icon: 'play', act: () => send({ c: 'send', key: sigKey(cur.p, cur.k), raw: !!cur.p.sendRaw }) },
      { label: 'Regravar', act: () => beginLearnStep() },
      hasNext ? { label: 'Próximo: ' + nextLabel, cls: 'primary', act: () => { L.idx++; beginLearnStep(); } }
              : { label: 'Concluir', cls: 'primary', act: () => closeLearn(false) },
    ];
  } else {
    body = `<div class="learn fail">${step}
      <div class="ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="66"/><circle class="fg" id="ringFg" cx="75" cy="75" r="66"/></svg>
        <div class="center">${icon('x')}</div></div>
      <h2>Nenhum sinal recebido</h2>
      <p>Chegue o controle mais perto do receptor IR (até 30 cm) e tente de novo.</p></div>`;
    actions = [
      { label: 'Fechar', act: () => closeLearn(false) },
      hasNext ? { label: 'Pular', act: () => { L.idx++; beginLearnStep(); } } : null,
      { label: 'Tentar de novo', cls: 'primary', act: () => beginLearnStep() },
    ].filter(Boolean);
  }
  openSheet(body, actions, { onCancel: () => closeLearn(true) });
  updateRing();
}

// ======================================================================
// Folha (dialog) genérica
// ======================================================================
let sheetCancel = null;
function openSheet(html, actions = [], opts = {}) {
  const d = $('#sheet');
  sheetCancel = opts.onCancel || null;
  $('#sheetIn').innerHTML = `<div class="grabber"></div>${html}` +
    (actions.length ? `<div class="sheet-actions">${actions.map((a, i) =>
      `<button type="button" class="btn ${a.cls || ''}" data-a="${i}">${a.icon ? icon(a.icon) : ''}${esc(a.label)}</button>`).join('')}</div>` : '');
  $('#sheetIn').querySelectorAll('[data-a]').forEach(b => b.onclick = () => actions[+b.dataset.a].act());
  if (!d.open) d.showModal();
  const inner = $('#sheetIn');
  inner.tabIndex = -1;
  inner.focus({ preventScroll: true });  // sem anel de foco no primeiro botão
  if (opts.onMount) opts.onMount(inner);
}
function closeSheet() { sheetCancel = null; const d = $('#sheet'); if (d.open) d.close(); }
$('#sheet').addEventListener('cancel', e => { e.preventDefault(); const c = sheetCancel; if (c) c(); else closeSheet(); });
$('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) { const c = sheetCancel; if (c) c(); else closeSheet(); } });

function confirmSheet(title, text, okLabel = 'Confirmar', danger = false) {
  return new Promise(res => {
    const done = v => { closeSheet(); res(v); };
    openSheet(`<h2>${esc(title)}</h2><p class="hint">${text}</p>`,
      [{ label: 'Cancelar', act: () => done(false) }, { label: okLabel, cls: danger ? 'danger' : 'primary', act: () => done(true) }],
      { onCancel: () => done(false) });
  });
}

let toastTimer = null;
function toast(msg, kind = '') {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast' + (kind === 'err' ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, kind === 'err' ? 3800 : 2200);
}

// ======================================================================
// Render: controle (layout editável)
// ======================================================================
function missDot(p, k) { return hasSig(p, k) ? '' : '<span class="miss-dot" aria-label="não gravado"></span>'; }

function renderItem(p, it, si, ii) {
  const at = `data-s="${si}" data-i="${ii}"`;
  if (it.type === 'rocker') {
    const part = (k, ic, cls) => `<button type="button" class="rk ${cls} ${hasSig(p, k) ? '' : 'missing'}" data-cmd="${esc(k)}" aria-label="${esc(cmdLabel(p, k))}">${icon(ic)}${missDot(p, k)}</button>`;
    return `<div class="tile rocker" ${at}>${part(it.up, 'plus', 'up')}<span class="rk-label">${esc(it.label || '')}</span>${part(it.down, 'minus', 'down')}</div>`;
  }
  if (it.type === 'dpad') {
    const part = (k, cls, inner) => `<button type="button" class="dp ${cls} ${hasSig(p, k) ? '' : 'missing'}" data-cmd="${esc(k)}" aria-label="${esc(cmdLabel(p, k))}">${inner}${missDot(p, k)}</button>`;
    return `<div class="dpad-wrap" ${at}><div class="dpad">${part(it.up, 'up', icon('up'))}${part(it.left, 'left', icon('left'))}`
      + `${part(it.ok, 'ok', 'OK')}${part(it.right, 'right', icon('right'))}${part(it.down, 'down', icon('down'))}</div></div>`;
  }
  const w = Math.min(4, Math.max(1, +it.w || 1));
  const label = it.label || cmdLabel(p, it.cmd) || 'Sem comando';
  const miss = !hasSig(p, it.cmd);
  return `<button type="button" class="tile c-${esc(it.color || 'default')} ${miss ? 'missing' : ''}" style="grid-column: span ${w}" ${at} data-cmd="${esc(it.cmd || '')}">`
    + `${icon(it.icon)}<span class="tl">${esc(label)}</span>${it.cmd ? missDot(p, it.cmd) : ''}</button>`;
}

function renderRemote() {
  const v = $('#view-remote');
  const p = active();
  if (!p) {
    v.innerHTML = `<div class="card empty"><div class="big">${icon('remote')}</div><h2>Nenhum controle ainda</h2>
      <p>Adicione um controle (ar-condicionado, TV, ventilador…), grave os botões do controle original e monte a sua tela.</p>
      <div class="row" style="justify-content:center">
        <button type="button" class="btn primary" data-go="new">${icon('plus')}Adicionar controle</button>
        ${app.link ? '' : `<button type="button" class="btn" data-go="connect">${icon('bt')}Conectar</button>`}
      </div>
      ${!app.link ? '<p class="hint">Sem receptor por perto? Use o modo demonstração em Ajustes.</p>' : ''}</div>`;
    return;
  }
  const total = p.commands.length, rec = recordedCount(p);
  let html = '';
  if (app.cached && !app.link) html += `<div class="banner"><b>Sem conexão</b>Mostrando a última versão salva neste aparelho. Conecte ao receptor para usar o controle.</div>`;
  if (app.editing) {
    html += `<div class="editbar"><span>Editando o layout de ${esc(p.name)}</span><button type="button" class="btn small" data-go="doneEdit">Concluir</button></div>`;
  } else {
    html += `<div class="row" style="justify-content:space-between">
      <span class="hint">${rec} de ${total} comandos gravados</span>
      <div class="row">
        ${rec < total ? `<button type="button" class="btn small" data-go="learnPending">${icon('rec')}Gravar pendentes</button>` : ''}
        <button type="button" class="btn small" data-go="edit">${icon('edit')}Editar</button>
      </div></div>`;
  }
  p.layout.forEach((s, si) => {
    const head = app.editing
      ? `<div class="section-head"><input type="text" aria-label="Nome da seção" value="${esc(s.title)}" data-stitle="${si}" maxlength="30" placeholder="Nome da seção">
          <button type="button" class="icon-btn" data-smove="${si}:-1" aria-label="Subir seção" ${si === 0 ? 'disabled' : ''}>${icon('up')}</button>
          <button type="button" class="icon-btn" data-smove="${si}:1" aria-label="Descer seção" ${si === p.layout.length - 1 ? 'disabled' : ''}>${icon('down')}</button>
          <button type="button" class="icon-btn" data-sdel="${si}" aria-label="Apagar seção">${icon('trash')}</button></div>`
      : (s.title ? `<div class="section-head"><h3>${esc(s.title)}</h3></div>` : '');
    const items = s.items.map((it, ii) => renderItem(p, it, si, ii)).join('');
    const add = app.editing ? `<button type="button" class="tile add" data-add="${si}">${icon('plus')}<span class="tl">Botão</span></button>` : '';
    if (!items && !app.editing) return;
    html += `<div class="section">${head}<div class="grid">${items}${add}</div></div>`;
  });
  if (app.editing) html += `<button type="button" class="add-section" data-go="addSection">${icon('plus')}Nova seção</button>`;
  else if (!p.layout.some(s => s.items.length)) {
    html += `<div class="card empty"><div class="big">${icon('grid')}</div><h2>Tela vazia</h2><p>Toque em Editar para adicionar botões a este controle.</p></div>`;
  }
  v.innerHTML = html;
  v.classList.toggle('editing', app.editing);
}

// ---------- editor de botão ----------
function openItemEditor(si, ii) {
  if (!requireLink()) return;
  const p = active();
  const isNew = ii == null;
  const draft = isNew ? B('', '', 'star', 'default', 1) : clone(p.layout[si].items[ii]);
  draft.newName = '';

  const cmdOptions = (sel, allowNew) => `<option value="">— nenhum —</option>`
    + p.commands.map(c => `<option value="${esc(c.k)}" ${c.k === sel ? 'selected' : ''}>${esc(c.label)}${hasSig(p, c.k) ? '' : ' (não gravado)'}</option>`).join('')
    + (allowNew ? `<option value="__new" ${sel === '__new' ? 'selected' : ''}>＋ Novo comando…</option>` : '');

  const render = () => {
    const t = draft.type;
    let fields = `<div class="field">Tipo<div class="seg" role="group">
      ${[['button', 'Botão'], ['rocker', 'Par + / −'], ['dpad', 'Direcional']].map(([v, l]) => `<button type="button" data-type="${v}" class="${t === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>`;
    if (t === 'button') {
      fields += `<label class="field">Comando<select id="fCmd">${cmdOptions(draft.cmd, true)}</select></label>
        <label class="field" id="fNewWrap" ${draft.cmd === '__new' ? '' : 'hidden'}>Nome do novo comando<input id="fNew" type="text" maxlength="30" placeholder="Ex.: Frio 23°" value="${esc(draft.newName)}"></label>
        <label class="field">Texto do botão<input id="fLabel" type="text" maxlength="24" placeholder="${esc(cmdLabel(p, draft.cmd) || 'Texto')}" value="${esc(draft.label)}"></label>
        <div class="field">Ícone<div class="icon-grid">
          <button type="button" data-icon="" class="${!draft.icon ? 'on' : ''}" aria-label="Sem ícone">—</button>
          ${PICK_ICONS.map(n => `<button type="button" data-icon="${n}" class="${draft.icon === n ? 'on' : ''}" aria-label="${n}">${icon(n)}</button>`).join('')}</div></div>
        <div class="field">Cor<div class="swatches">${COLORS.map(([v, l, c]) => `<button type="button" data-color="${v}" class="${(draft.color || 'default') === v ? 'on' : ''}" style="background:${c}" aria-label="${l}"></button>`).join('')}</div></div>
        <div class="field">Largura<div class="seg">${[1, 2, 3, 4].map(n => `<button type="button" data-w="${n}" class="${(+draft.w || 1) === n ? 'on' : ''}">${n === 4 ? 'Linha toda' : n}</button>`).join('')}</div></div>`;
    } else if (t === 'rocker') {
      fields += `<label class="field">Texto<input id="fLabel" type="text" maxlength="12" placeholder="Ex.: Vol" value="${esc(draft.label || '')}"></label>
        <label class="field">Comando do +<select id="fUp">${cmdOptions(draft.up)}</select></label>
        <label class="field">Comando do −<select id="fDown">${cmdOptions(draft.down)}</select></label>`;
    } else {
      fields += ['up', 'down', 'left', 'right', 'ok'].map(f => `<label class="field">${{ up: 'Cima', down: 'Baixo', left: 'Esquerda', right: 'Direita', ok: 'Centro (OK)' }[f]}
        <select data-dir="${f}">${cmdOptions(draft[f])}</select></label>`).join('');
    }
    const actions = [];
    if (!isNew) {
      actions.push({ label: '', icon: 'left', act: () => moveItem(-1) }, { label: '', icon: 'right', act: () => moveItem(1) });
      actions.push({ label: 'Apagar', cls: 'danger', act: () => { p.layout[si].items.splice(ii, 1); saveProfile(p); closeSheet(); renderRemote(); } });
    }
    actions.push({ label: isNew ? 'Adicionar' : 'Salvar', cls: 'primary', act: save });
    openSheet(`<h2>${isNew ? 'Novo botão' : 'Editar botão'}</h2>${fields}`, actions, {
      onMount: root => {
        root.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
          collect(root);
          draft.type = b.dataset.type;
          if (draft.type === 'rocker') { draft.up = draft.up || ''; draft.down = draft.down || ''; }
          if (draft.type === 'dpad') ['up', 'down', 'left', 'right', 'ok'].forEach(f => draft[f] = draft[f] || (p.commands.some(c => c.k === f) ? f : ''));
          render();
        });
        root.querySelectorAll('[data-icon]').forEach(b => b.onclick = () => { collect(root); draft.icon = b.dataset.icon; render(); });
        root.querySelectorAll('[data-color]').forEach(b => b.onclick = () => { collect(root); draft.color = b.dataset.color; render(); });
        root.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { collect(root); draft.w = +b.dataset.w; render(); });
        const fc = $('#fCmd', root);
        if (fc) fc.onchange = () => { collect(root); render(); };
      },
    });
  };
  const collect = root => {
    const v = id => { const e = $('#' + id, root); return e ? e.value : undefined; };
    if (v('fCmd') !== undefined) draft.cmd = v('fCmd');
    if (v('fNew') !== undefined) draft.newName = v('fNew');
    if (v('fLabel') !== undefined) draft.label = v('fLabel');
    if (v('fUp') !== undefined) draft.up = v('fUp');
    if (v('fDown') !== undefined) draft.down = v('fDown');
    root.querySelectorAll('[data-dir]').forEach(s => draft[s.dataset.dir] = s.value);
  };
  const moveItem = dir => {
    const items = p.layout[si].items, j = ii + dir;
    if (j < 0 || j >= items.length) return;
    [items[ii], items[j]] = [items[j], items[ii]];
    ii = j; saveProfile(p); renderRemote();
  };
  const save = () => {
    collect($('#sheetIn'));
    let out;
    if (draft.type === 'button') {
      let cmd = draft.cmd;
      if (cmd === '__new') {
        if (!draft.newName.trim()) return toast('Dê um nome ao novo comando', 'err');
        cmd = addCommand(p, draft.newName);
      }
      out = { type: 'button', cmd, label: (draft.label || '').trim(), icon: draft.icon || '', color: draft.color || 'default', w: +draft.w || 1 };
    } else if (draft.type === 'rocker') {
      out = { type: 'rocker', label: (draft.label || '').trim(), up: draft.up || '', down: draft.down || '' };
    } else {
      out = { type: 'dpad', up: draft.up || '', down: draft.down || '', left: draft.left || '', right: draft.right || '', ok: draft.ok || '' };
    }
    if (isNew) p.layout[si].items.push(out); else p.layout[si].items[ii] = out;
    saveProfile(p); closeSheet(); renderRemote();
  };
  render();
}

// Render: comandos
// ======================================================================
function renderCommands() {
  const v = $('#view-commands');
  const p = active();
  if (!p) { v.innerHTML = `<div class="card empty"><div class="big">${icon('list')}</div><h2>Nenhum controle</h2><p>Crie um controle em Perfis para começar a gravar comandos.</p>
    <button type="button" class="btn primary" data-go="new">${icon('plus')}Adicionar controle</button></div>`; return; }
  const total = p.commands.length, rec = recordedCount(p);
  const pending = p.commands.filter(c => !hasSig(p, c.k)).map(c => c.k);
  v.innerHTML = `<div class="card">
      <div class="row" style="justify-content:space-between"><h2>${rec} de ${total} gravados</h2>
        ${pending.length ? `<button type="button" class="btn small accent" data-go="learnPending">${icon('rec')}Gravar ${pending.length} pendente${pending.length > 1 ? 's' : ''}</button>` : '<span class="tag ok">Completo</span>'}</div>
      <div class="progress"><i style="width:${total ? Math.round(rec / total * 100) : 0}%"></i></div>
      <p>Os comandos base vêm do modelo do controle. Grave cada um com o controle original. Você pode renomear, apagar ou criar os seus.</p>
    </div>
    <div class="card">
      ${total ? `<ul class="list">${p.commands.map(c => {
        const s = app.signals.get(sigKey(p, c.k));
        const sub = s ? `${s.p || 'RAW'}${s.b ? ' · ' + s.b + ' bits' : ''}` : 'Não gravado';
        return `<li><div class="li-main"><b>${esc(c.label)}</b><small><span class="mono">${esc(c.k)}</span> · ${esc(sub)}</small></div>
          <button type="button" class="icon-btn rec" data-cact="learn" data-k="${esc(c.k)}" aria-label="Gravar ${esc(c.label)}">${icon('rec')}</button>
          <button type="button" class="icon-btn" data-cact="test" data-k="${esc(c.k)}" aria-label="Testar ${esc(c.label)}" ${s ? '' : 'disabled'}>${icon('play')}</button>
          <button type="button" class="icon-btn" data-cact="more" data-k="${esc(c.k)}" aria-label="Mais opções">${icon('dots')}</button></li>`;
      }).join('')}</ul>` : '<p>Este controle ainda não tem comandos.</p>'}
      <button type="button" class="btn" data-go="addCommand">${icon('plus')}Novo comando</button>
    </div>`;
}

function openCommandMenu(p, k) {
  if (!requireLink()) return;
  const c = p.commands.find(x => x.k === k); if (!c) return;
  const uses = p.layout.reduce((n, s) => n + s.items.filter(it => ['cmd', 'up', 'down', 'left', 'right', 'ok'].some(f => it[f] === k)).length, 0);
  openSheet(`<h2>${esc(c.label)}</h2>
    <label class="field">Nome<input id="fName" type="text" maxlength="30" value="${esc(c.label)}"></label>
    <p class="hint">Identificador <span class="mono">${esc(k)}</span> · usado em ${uses} botão${uses === 1 ? '' : 'es'} da tela.</p>`, [
    { label: 'Apagar', cls: 'danger', act: async () => {
      const ok = await confirmSheet('Apagar comando?', `“${esc(c.label)}” e o sinal gravado serão apagados. Os botões que usam este comando ficam sem comando.`, 'Apagar', true);
      if (ok) { deleteCommand(p, k); renderCurrent(); }
    } },
    { label: 'Salvar', cls: 'primary', act: () => {
      const name = $('#fName').value.trim(); if (!name) return toast('O nome não pode ficar vazio', 'err');
      c.label = name; saveProfile(p); closeSheet(); renderCurrent();
    } },
  ]);
}

function openAddCommand(p) {
  if (!requireLink()) return;
  openSheet(`<h2>Novo comando</h2>
    <label class="field">Nome<input id="fName" type="text" maxlength="30" placeholder="Ex.: Frio 23°, Netflix, Número 1"></label>
    <label class="switch">Adicionar um botão na tela<input id="fBtn" type="checkbox" checked></label>`, [
    { label: 'Cancelar', act: closeSheet },
    { label: 'Criar e gravar', cls: 'primary', act: () => {
      const name = $('#fName').value.trim(); if (!name) return toast('Dê um nome ao comando', 'err');
      const k = addCommand(p, name);
      if ($('#fBtn').checked) {
        if (!p.layout.length) p.layout.push({ title: 'Botões', items: [] });
        p.layout[p.layout.length - 1].items.push(B(k, '', 'star', 'default', 1));
      }
      saveProfile(p); closeSheet(); renderCurrent();
      startLearn(p, [k]);
    } },
  ], { onMount: r => $('#fName', r).focus() });
}

// ======================================================================
// Render: perfis
// ======================================================================
function renderProfiles() {
  const v = $('#view-profiles');
  v.innerHTML = `<div class="card">
      <h2>Seus controles</h2>
      ${app.profiles.length ? `<ul class="list">${app.profiles.map(p => `<li>
        <span class="li-icon">${icon(p.icon)}</span>
        <div class="li-main"><b>${esc(p.name)}</b><small>${esc(TEMPLATES[p.type].name)} · ${recordedCount(p)}/${p.commands.length} gravados</small></div>
        <button type="button" class="btn small" data-pact="open" data-pid="${esc(p.id)}">Abrir</button>
        <button type="button" class="icon-btn" data-pact="edit" data-pid="${esc(p.id)}" aria-label="Editar ${esc(p.name)}">${icon('edit')}</button></li>`).join('')}</ul>`
        : '<p>Nenhum controle ainda. Cada controle tem os seus próprios comandos e a sua própria tela.</p>'}
      <button type="button" class="btn primary" data-go="new">${icon('plus')}Novo controle</button>
    </div>`;
}

function openProfileEditor(p) {
  if (!requireLink()) return;
  const isNew = !p;
  const draft = isNew ? { name: '', type: 'ac', icon: TEMPLATES.ac.icon, sendRaw: false } : { name: p.name, type: p.type, icon: p.icon, sendRaw: p.sendRaw };
  let iconTouched = !isNew;
  const render = () => {
    const tpls = isNew ? `<div class="field">Tipo de controle<div class="tpl-grid">${Object.entries(TEMPLATES).map(([k, t]) =>
      `<button type="button" class="tpl ${draft.type === k ? 'on' : ''}" data-tpl="${k}">${icon(t.icon)}<b>${esc(t.name)}</b><small>${t.commands.length ? t.commands.length + ' comandos base' : esc(t.desc)}</small></button>`).join('')}</div></div>` : '';
    openSheet(`<h2>${isNew ? 'Novo controle' : 'Editar controle'}</h2>
      <label class="field">Nome<input id="fName" type="text" maxlength="24" placeholder="Ex.: Ar do quarto" value="${esc(draft.name)}"></label>
      ${tpls}
      <div class="field">Ícone<div class="icon-grid">${PICK_ICONS.map(n => `<button type="button" data-icon="${n}" class="${draft.icon === n ? 'on' : ''}" aria-label="${n}">${icon(n)}</button>`).join('')}</div></div>
      <label class="switch"><span>Enviar como sinal bruto<br><span class="hint">Repete os tempos gravados em vez de recriar o código. Ative se o aparelho não responder aos comandos gravados.</span></span><input id="fRaw" type="checkbox" ${draft.sendRaw ? 'checked' : ''}></label>`,
    [
      ...(isNew ? [{ label: 'Cancelar', act: closeSheet }] : [{ label: 'Apagar', cls: 'danger', act: () => deleteProfile(p) }]),
      { label: isNew ? 'Criar' : 'Salvar', cls: 'primary', act: save },
    ], {
      onMount: root => {
        root.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => { collect(root); draft.type = b.dataset.tpl; if (!iconTouched) draft.icon = TEMPLATES[draft.type].icon; render(); });
        root.querySelectorAll('[data-icon]').forEach(b => b.onclick = () => { collect(root); draft.icon = b.dataset.icon; iconTouched = true; render(); });
      },
    });
  };
  const collect = root => { draft.name = $('#fName', root).value; draft.sendRaw = $('#fRaw', root).checked; };
  const save = () => {
    collect($('#sheetIn'));
    const name = draft.name.trim() || TEMPLATES[draft.type].name;
    if (isNew) {
      const np = makeProfile(newProfileId(), name, draft.type, app.profiles.reduce((m, x) => Math.max(m, x.order + 1), 0));
      np.icon = draft.icon; np.sendRaw = draft.sendRaw;
      app.profiles.push(np);
      app.activeId = np.id; store.set('active', np.id);
      saveProfile(np);
      closeSheet();
      toast('Controle criado. Grave os comandos com o controle original.');
      setView(np.commands.length ? 'commands' : 'remote');
    } else {
      Object.assign(p, { name, icon: draft.icon, sendRaw: draft.sendRaw });
      saveProfile(p); closeSheet(); renderAll();
    }
  };
  render();
}

async function deleteProfile(p) {
  const n = recordedCount(p);
  const ok = await confirmSheet(`Apagar “${p.name}”?`, `O controle, a tela dele e ${n} comando${n === 1 ? '' : 's'} gravado${n === 1 ? '' : 's'} serão apagados do receptor. Não dá para desfazer.`, 'Apagar', true);
  if (!ok) return;
  send({ c: 'delProfile', id: p.id });
  app.profiles = app.profiles.filter(x => x.id !== p.id);
  if (app.activeId === p.id) app.activeId = app.profiles[0] ? app.profiles[0].id : null;
  if (!app.link || app.link.kind !== 'demo') cacheNow();
  renderAll();
}

// ======================================================================
// Render: ajustes
// ======================================================================
function renderSettings() {
  const v = $('#view-settings');
  const d = app.dev, em = d && d.emitter || {};
  const prefixes = app.profiles.map(p => p.id + '-');
  const legacy = [...app.signals.keys()].filter(k => k !== QUICK_SLOT && !prefixes.some(px => k.startsWith(px))).sort();
  const quick = app.signals.get(QUICK_SLOT);
  const theme = store.get('theme', 'system');
  const noBt = !deviceHosted && !navigator.bluetooth;
  const ir = app.lastIr;
  v.innerHTML = `
    ${noBt ? `<div class="banner"><b>Este navegador não tem Web Bluetooth</b>Use o Chrome no Android, ou o app Bluefy no iPhone. Com o receptor ESP32-S2, conecte-se à rede Wi-Fi do receptor e abra http://192.168.4.1.</div>` : ''}
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>Receptor</h2>
        ${app.link ? `<button type="button" class="btn small" data-go="disconnect">Desconectar</button>` : `<button type="button" class="btn small primary" data-go="connect">${icon(deviceHosted ? 'wifi' : 'bt')}Conectar</button>`}</div>
      <dl class="kv"><dt>Conexão</dt><dd>${app.link ? esc(app.link.name) : 'desconectado'}</dd><dt>Firmware</dt><dd class="mono">${esc(d ? d.fw : '—')}</dd></dl>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>Emissor IR</h2>
        <span class="tag ${em.online ? 'ok' : 'pend'}">${!d ? '—' : em.online ? 'Online' : em.paired ? 'Offline' : 'Não pareado'}</span></div>
      <dl class="kv"><dt>MAC</dt><dd class="mono">${esc(em.mac || '—')}</dd><dt>Firmware</dt><dd class="mono">${esc(em.fw || '—')}</dd></dl>
      <div class="row"><button type="button" class="btn grow" data-go="ping" ${app.link ? '' : 'disabled'}>${icon('signal')}Testar emissor</button>
        <button type="button" class="btn danger grow" data-go="unpair" ${app.link ? '' : 'disabled'}>Esquecer emissor</button></div>
      <p>Ao esquecer, o receptor pareia com o próximo emissor que ligar.</p>
    </div>
    <div class="card">
      <h2>Último sinal recebido</h2>
      <p>Aperte qualquer botão de um controle apontado para o receptor.</p>
      <p class="mono" style="color:var(--text); overflow-wrap:anywhere">${ir ? `${esc(ir.proto)} · ${ir.bits} bits · ${esc(ir.hex)}` : '—'}</p>
    </div>
    <div class="card">
      <h2>Botões físicos do receptor</h2>
      <p>GRAVAR guarda um sinal no espaço rápido. ENVIAR repete esse sinal.</p>
      <div class="row"><span class="grow">${quick ? `Sinal rápido: <span class="mono">${esc(quick.p || 'RAW')}${quick.b ? ' · ' + quick.b + ' bits' : ''}</span>` : 'Nenhum sinal rápido gravado'}</span>
        ${quick ? `<button type="button" class="btn small" data-go="sendQuick">${icon('play')}Testar</button>` : ''}</div>
    </div>
    ${legacy.length ? `<div class="card"><h2>Sinais sem controle</h2><p>Sinais gravados que não pertencem a nenhum controle (por exemplo, da versão anterior).</p>
      <ul class="list">${legacy.map(k => { const s = app.signals.get(k) || {}; return `<li><div class="li-main"><b class="mono">${esc(k)}</b><small>${esc(s.p || 'RAW')}${s.b ? ' · ' + s.b + ' bits' : ''}</small></div>
        <button type="button" class="icon-btn" data-legacy="send" data-k="${esc(k)}" aria-label="Enviar">${icon('play')}</button>
        <button type="button" class="icon-btn" data-legacy="del" data-k="${esc(k)}" aria-label="Apagar">${icon('trash')}</button></li>`; }).join('')}</ul></div>` : ''}
    <div class="card">
      <h2>Aparência</h2>
      <div class="seg">${[['system', 'Sistema'], ['light', 'Claro'], ['dark', 'Escuro']].map(([k, l]) => `<button type="button" data-theme-set="${k}" class="${theme === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    </div>
    <div class="card">
      <h2>Modo demonstração</h2>
      <p>Simula o receptor com dois controles de exemplo, para conhecer a página sem hardware.</p>
      <button type="button" class="btn" data-go="demo" ${app.link && app.link.kind !== 'demo' ? 'disabled' : ''}>${app.link && app.link.kind === 'demo' ? 'Sair da demonstração' : 'Abrir demonstração'}</button>
    </div>`;
}

function applyTheme() {
  const t = store.get('theme', 'system');
  if (t === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
}

// ======================================================================
// Render geral e eventos
// ======================================================================
function renderCurrent() {
  if (app.view === 'remote') renderRemote();
  else if (app.view === 'commands') renderCommands();
  else if (app.view === 'profiles') renderProfiles();
  else renderSettings();
}
function renderAll() { renderHeader(); renderCurrent(); }

function go(what) {
  const p = active();
  switch (what) {
    case 'new': setView('profiles'); openProfileEditor(null); break;
    case 'connect': connect(deviceHosted ? 'http' : 'ble'); break;
    case 'disconnect': disconnect(); break;
    case 'demo': if (app.link && app.link.kind === 'demo') disconnect(); else connect('demo'); break;
    case 'edit': if (requireLink()) { app.editing = true; renderRemote(); } break;
    case 'doneEdit': app.editing = false; renderRemote(); break;
    case 'addSection': p.layout.push({ title: 'Nova seção', items: [] }); saveProfile(p); renderRemote(); break;
    case 'learnPending': startLearn(p, p.commands.filter(c => !hasSig(p, c.k)).map(c => c.k)); break;
    case 'addCommand': openAddCommand(p); break;
    case 'ping': send({ c: 'ping' }) && toast('Testando o emissor…'); break;
    case 'unpair': confirmSheet('Esquecer o emissor?', 'O receptor vai parear com o próximo emissor que ligar.', 'Esquecer', true).then(ok => ok && send({ c: 'unpair' })); break;
    case 'sendQuick': send({ c: 'send', key: QUICK_SLOT }); break;
  }
}

function setup() {
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = icon(e.dataset.ic));
  applyTheme();

  document.querySelectorAll('.tab').forEach(t => t.onclick = () => setView(t.dataset.view));
  $('#connPill').onclick = () => app.link ? setView('settings') : go('connect');

  $('#chips').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.new) return go('new');
    app.activeId = b.dataset.pid; store.set('active', app.activeId); app.editing = false; renderAll();
  };

  document.querySelector('main').addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const p = active();

    // Controle
    if (e.target.closest('#view-remote')) {
      if (app.editing) {
        const add = e.target.closest('[data-add]'); if (add) return openItemEditor(+add.dataset.add, null);
        const sm = e.target.closest('[data-smove]');
        if (sm) { const [si, dir] = sm.dataset.smove.split(':').map(Number); const j = si + dir; [p.layout[si], p.layout[j]] = [p.layout[j], p.layout[si]]; saveProfile(p); return renderRemote(); }
        const sd = e.target.closest('[data-sdel]');
        if (sd) {
          const si = +sd.dataset.sdel, n = p.layout[si].items.length;
          if (!n) { p.layout.splice(si, 1); saveProfile(p); return renderRemote(); }
          return confirmSheet('Apagar seção?', `A seção e os ${n} botões dela saem da tela. Os comandos gravados continuam salvos.`, 'Apagar', true)
            .then(ok => { if (ok) { p.layout.splice(si, 1); saveProfile(p); renderRemote(); } });
        }
        const it = e.target.closest('[data-s][data-i]'); if (it) return openItemEditor(+it.dataset.s, +it.dataset.i);
        return;
      }
      const c = e.target.closest('[data-cmd]'); if (c) return press(c.dataset.cmd, c);
    }

    // Comandos
    const ca = e.target.closest('[data-cact]');
    if (ca) {
      const k = ca.dataset.k;
      if (ca.dataset.cact === 'learn') startLearn(p, [k]);
      else if (ca.dataset.cact === 'test') send({ c: 'send', key: sigKey(p, k), raw: !!p.sendRaw });
      else openCommandMenu(p, k);
      return;
    }

    // Perfis
    const pa = e.target.closest('[data-pact]');
    if (pa) {
      const target = app.profiles.find(x => x.id === pa.dataset.pid);
      if (pa.dataset.pact === 'open') { app.activeId = target.id; store.set('active', target.id); setView('remote'); }
      else openProfileEditor(target);
      return;
    }

    // Ajustes
    const lg = e.target.closest('[data-legacy]');
    if (lg) {
      if (lg.dataset.legacy === 'send') send({ c: 'send', key: lg.dataset.k });
      else confirmSheet('Apagar sinal?', `O sinal <span class="mono">${esc(lg.dataset.k)}</span> será apagado do receptor.`, 'Apagar', true).then(ok => ok && send({ c: 'del', key: lg.dataset.k }));
      return;
    }
    const th = e.target.closest('[data-theme-set]');
    if (th) { store.set('theme', th.dataset.themeSet); applyTheme(); renderSettings(); }
  });

  // Nome da seção (modo edição)
  document.querySelector('main').addEventListener('change', e => {
    const t = e.target.closest('[data-stitle]'); if (!t) return;
    const p = active(); p.layout[+t.dataset.stitle].title = t.value.trim(); saveProfile(p);
  });

  if (deviceHosted) connect('http');
  else loadCache();
  if (!active() && app.profiles[0]) app.activeId = app.profiles[0].id;
  renderAll();
}

setup();
</script>
</body>
</html>
