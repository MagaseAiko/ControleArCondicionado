; Receptor: cérebro do sistema.
; - Lê o controle original (receptor IR), grava sinais e decide o que enviar.
; - Conversa com o celular (BLE ou Wi-Fi) e com o Emissor (ESP-NOW).
;
; Placa principal: ESP32 DevKit V1 (ESP-WROOM-32), conexão BLE.
; As outras placas ficam como alternativa.

[platformio]
default_envs = esp32-devkitv1

; Opções comuns a todas as placas
[env]
; Arduino core 2.x (o IRremoteESP8266 ainda não suporta o core 3.x)
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
build_flags = -I../common
lib_deps =
  crankyoldgit/IRremoteESP8266@^2.8.6
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit NeoPixel@^1.12.3

; ---------- ESP32 DevKit V1 / ESP-WROOM-32 (BLE) — PRINCIPAL ----------
[env:esp32-devkitv1]
board = esp32doit-devkit-v1
; app de 3MB (IRac + BLE) e ~900KB para os sinais gravados
board_build.partitions = huge_app.csv
lib_deps = ${env.lib_deps}
  h2zero/NimBLE-Arduino@^1.4.3
build_flags = ${env.build_flags}
  -DTRANSPORT_BLE
  -DPIN_IR_RX=27
  -DPIN_BTN_REC=25
  -DPIN_BTN_SEND=26
  -DPIN_RGB=-1
  -DPIN_LED=2

; ======================= placas alternativas =======================

; ESP32-S2 Saola-1 (Wi-Fi, sem BLE: o receptor cria a própria rede)
[env:esp32-s2-saola-1]
board = esp32-s2-saola-1
build_flags = ${env.build_flags}
  -DTRANSPORT_WIFI
  -DPIN_IR_RX=4
  -DPIN_BTN_REC=5
  -DPIN_BTN_SEND=6
  -DPIN_RGB=18

; ESP32-S3 DevKitC (BLE)
[env:esp32-s3-ble]
board = esp32-s3-devkitc-1
lib_deps = ${env.lib_deps}
  h2zero/NimBLE-Arduino@^1.4.3
build_flags = ${env.build_flags}
  -DTRANSPORT_BLE
  -DPIN_IR_RX=4
  -DPIN_BTN_REC=5
  -DPIN_BTN_SEND=6
  -DPIN_RGB=48

; ESP32-C3 DevKitM (BLE)
[env:esp32-c3-ble]
board = esp32-c3-devkitm-1
; app de 3MB (IRac + BLE) e ~900KB para os sinais gravados
board_build.partitions = huge_app.csv
lib_deps = ${env.lib_deps}
  h2zero/NimBLE-Arduino@^1.4.3
build_flags = ${env.build_flags}
  -DTRANSPORT_BLE
  -DPIN_IR_RX=4
  -DPIN_BTN_REC=5
  -DPIN_BTN_SEND=6
  -DPIN_RGB=8
  -DIR_TIMER=0
