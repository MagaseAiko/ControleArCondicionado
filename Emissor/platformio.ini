; Emissor: ESP-01 (1MB) com um LED infravermelho.
; Recebe comandos do Receptor por ESP-NOW e dispara o LED IR.

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
build_flags =
  -I../common
  ; Pino do LED IR. GPIO3 (RX) é o mais seguro no ESP-01: não interfere no boot.
  -DIR_LED_PIN=3
lib_deps =
  crankyoldgit/IRremoteESP8266@^2.8.6
