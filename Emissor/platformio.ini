; Emissor: ESP-01 (1MB) com um LED infravermelho.
; Recebe comandos do Receptor por ESP-NOW e dispara o LED IR.

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
build_flags =
  -I../common
  ; Pino do LED IR. GPIO3 (RX) é o mais seguro no ESP-01: não interfere no boot.
  -DIR_LED_PIN=3
  ; 0 = transistor NPN (2N2222, BC337, S8050): GPIO em 1 acende o LED.
  ; 1 = transistor PNP (BC557, BC327, 2N3906): GPIO em 0 acende o LED.
  -DIR_LED_INVERTED=0
lib_deps =
  crankyoldgit/IRremoteESP8266@^2.8.6
